services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: cognera_admin
      POSTGRES_PASSWORD: cognera_local_admin
      POSTGRES_DB: cognera
    ports:
      - "5433:5432"
    volumes:
      - cognera_postgres:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cognera_admin -d cognera"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:
    profiles: ["ai"]
    image: ollama/ollama:0.12.11
    ports:
      - "11434:11434"

  app:
    profiles: ["app"]
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://cognera_app:cognera_local_app@postgres:5432/cognera
      DATABASE_MIGRATION_URL: postgres://cognera_admin:cognera_local_admin@postgres:5432/cognera
      PUBLIC_SITE_URL: http://localhost:3000
    ports:
      - "3000:3000"

volumes:
  cognera_postgres:
