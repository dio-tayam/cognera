name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run format:check
      - run: npm run check:secrets
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: cognera_admin
          POSTGRES_PASSWORD: cognera_local_admin
          POSTGRES_DB: cognera
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cognera_admin -d cognera"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_MIGRATION_URL: postgres://cognera_admin:cognera_local_admin@localhost:5432/cognera
      DATABASE_URL: postgres://cognera_app:cognera_local_app@localhost:5432/cognera
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:status
      - run: npm run db:check-app
